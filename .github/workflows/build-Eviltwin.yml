name: EvilTwin — Build Kernel + Patched Wi-Fi Driver

on:
  push:
    branches: [ "17" ]
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force build even if upstream has not changed"
        required: false
        default: "true"
  schedule:
    # Runs daily at 04:00 UTC (09:30 AM IST) to check for Vibranium / KSUN / SuSFS updates
    - cron: '0 4 * * *'

permissions:
  contents: write

jobs:
  check-upstream:
    name: Check Upstream Updates (Vibranium + KSUN + SuSFS)
    runs-on: ubuntu-24.04
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      upstream_state: ${{ steps.check.outputs.upstream_state }}
      ksun_tag: ${{ steps.check.outputs.ksun_tag }}
    steps:
      - name: Compare Upstream SHAs Against Latest Release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VIB_SHA=$(git ls-remote https://github.com/khargosxh18/android_kernel_xiaomi_sm8635.git HEAD | awk '{print substr($1,1,7)}')
          KSUN_TAG=$(curl -sL "https://api.github.com/repos/KernelSU-Next/KernelSU-Next/releases/latest" | grep -oE '"tag_name":\s*"[^"]+"' | head -n1 | cut -d'"' -f4 || true)
          [[ -z "$KSUN_TAG" ]] && KSUN_TAG="v3.3.0"
          SUSFS_SHA=$(git ls-remote https://gitlab.com/simonpunk/susfs4ksu.git refs/heads/gki-android14-6.1 | awk '{print substr($1,1,7)}')

          STATE="vib:${VIB_SHA}_ksun:${KSUN_TAG}_susfs:${SUSFS_SHA}"
          echo "Current upstream fingerprint: $STATE"
          echo "upstream_state=$STATE" >> "$GITHUB_OUTPUT"
          echo "ksun_tag=$KSUN_TAG" >> "$GITHUB_OUTPUT"

          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "Triggered by ${{ github.event_name }} — proceeding with build."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LAST_BODY=$(gh release view --repo "${{ github.repository }}" --json body -q ".body" 2>/dev/null || true)
          if [[ "$LAST_BODY" == *"$STATE"* ]]; then
            echo "No upstream changes detected since last release ($STATE). Skipping scheduled build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "New upstream update detected! Triggering automated build."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: EvilTwin (ksun-susfs + qca6750)
    needs: check-upstream
    if: needs.check-upstream.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Checkout EvilTwin Kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          
      - name: Checkout EvilTwin Patched Wi-Fi Modules
        uses: actions/checkout@v4
        with:
          repository: Raju-yeager/Eviltwin-drivers_kernel_xiaomi_sm8635-modules
          path: modules_src
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex git git-lfs gnupg gperf \
            imagemagick libelf-dev liblz4-tool libncurses-dev libssl-dev \
            libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools \
            xsltproc zip zlib1g-dev python3 python3-pip pahole dwarves zstd
            
      - name: Setup Neutron Clang 23 Toolchain
        id: clang
        run: |
          CLANG_DIR="$HOME/neutron-clang"
          mkdir -p "$CLANG_DIR"
          if [[ ! -f "$CLANG_DIR/bin/clang" ]]; then
            curl -sL "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman" -o /tmp/antman
            chmod +x /tmp/antman
            (cd "$CLANG_DIR" && /tmp/antman -S)
          fi
          echo "clang_dir=$CLANG_DIR" >> "$GITHUB_OUTPUT"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: eviltwin-ccache-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            eviltwin-ccache-${{ github.ref_name }}-
            eviltwin-ccache-

      - name: Configure ccache
        run: |
          ccache -M 5G
          ccache -z

      - name: Build EvilTwin Unified Kernel & Magisk ZIP
        env:
          CLANG_DIR: ${{ steps.clang.outputs.clang_dir }}
          KSUN_TAG: ${{ needs.check-upstream.outputs.ksun_tag }}
          ZIP_PREFIX: EvilTwin
          ZIP_VERSION: v1.0
        run: |
          chmod +x scripts/ci/build-project.sh
          ./scripts/ci/build-project.sh ksun-susfs

      - name: Upload EvilTwin Flashable ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: EvilTwin-ksun-susfs-Flashable
          path: |
            dist/*.zip
          if-no-files-found: error

      - name: Upload Build Logs & Symvers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EvilTwin-build-debug
          path: |
            dist/Module.symvers-*
            dist/config-*
            out/build.log
            out/wlan_build.log
          if-no-files-found: warn

  release:
    name: Publish GitHub Release & Post to Telegram
    needs: [check-upstream, build]
    if: success()
    runs-on: ubuntu-24.04
    steps:
      - name: Download Built Artifacts
        uses: actions/download-artifact@v4
        with:
          name: EvilTwin-ksun-susfs-Flashable
          path: release_files

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: eviltwin-v1.0-${{ github.run_number }}
          name: "EvilTwin Kernel v1.0 (KSUN + SuSFS + Monitor Mode) #${{ github.run_number }}"
          body: |
            ### EvilTwin Unified Kernel + Monitor Mode Driver (`peridot` / SM8635)
            - **Upstream State:** `${{ needs.check-upstream.outputs.upstream_state }}`
            - **KernelSU-Next (`${{ needs.check-upstream.outputs.ksun_tag }}`) + SuSFS:** Automatically synced
            - **Wi-Fi Driver:** Patched `qca_cld3_qca6750.ko` (`con_mode=4` Monitor Mode + Raw Frame capture)
          files: |
            release_files/*.zip

      - name: Post Release ZIPs to Telegram (@Evil_twin_peridot)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          UPSTREAM_STATE: ${{ needs.check-upstream.outputs.upstream_state }}
          KSUN_TAG: ${{ needs.check-upstream.outputs.ksun_tag }}
        run: |
          if [[ -z "$TELEGRAM_TOKEN" ]]; then
            echo "::warning::TELEGRAM_TOKEN secret is not set; skipping Telegram upload."
            exit 0
          fi

          CHAT_ID="@Evil_twin_peridot"
          KERNEL_ZIP=$(find "$GITHUB_WORKSPACE/release_files" -maxdepth 1 -name "EvilTwin-*ksun*.zip" | head -n 1)
          MAGISK_ZIP=$(find "$GITHUB_WORKSPACE/release_files" -maxdepth 1 -name "Universal-EvilTwin*.zip" | head -n 1)
          COMMIT_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          DATE_STR=$(date -u +"%d/%m/'%y")

          read -r -d '' CAPTION << EOF || true
          #Evil_Twin #Kernel #Peridot #AOSP #A17 #KSU #SUSFS
          <b>Evil_Twin Kernel v1.0 | Nightly | Android 17</b>
          <b>Device:</b> POCO F6 / Redmi Turbo 3 (<code>peridot</code> · SM8635)
          <b>Updated:</b> ${DATE_STR} (Build #${{ github.run_number }})

          ▪️ <a href="https://github.com/${{ github.repository }}/releases/tag/eviltwin-v1.0-${{ github.run_number }}">Download (GitHub Release)</a>
          ▪️ <a href="https://github.com/${{ github.repository }}">Kernel Source</a> | <a href="https://github.com/Raju-yeager/Eviltwin-drivers_kernel_xiaomi_sm8635-modules">Module Source</a>
          ▪️ <a href="https://t.me/Evil_twin_peridot">Updates &amp; Support</a>

          <b>Features &amp; Changelog:</b>
          • <b>Base:</b> Linux 6.1.176 Vibranium (Neutron Clang + Full LTO/CFI)
          • <b>Upstream Sync:</b> <code>${UPSTREAM_STATE}</code>
          • <b>Root:</b> KernelSU-Next (<code>${KSUN_TAG}</code>) + SuSFS v2.3.0
          • <b>Wireless:</b> Native <code>qca6750</code> Monitor Mode (<code>con_mode=4</code>) + Raw Frame &amp; Packet Injection
          • <b>Commit:</b> <a href="https://github.com/${{ github.repository }}/commit/${{ github.sha }}">${COMMIT_SHORT}</a>

          <b>Credits:</b>
          • khargosxh18 (Vibranium base), KernelSU-Next &amp; simonpunk
          • Built by <b>Raju-yeager</b>
          EOF

          # 1. Upload Flashable Kernel ZIP
          if [[ -f "$KERNEL_ZIP" ]]; then
            curl -sS -F "document=@${KERNEL_ZIP}" \
                 --form-string "chat_id=${CHAT_ID}" \
                 --form-string "parse_mode=HTML" \
                 --form-string "caption=${CAPTION}" \
                 "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendDocument"
          fi

          # 2. Upload Universal Magisk Module
          if [[ -f "$MAGISK_ZIP" ]]; then
            curl -sS -F "document=@${MAGISK_ZIP}" \
                 --form-string "chat_id=${CHAT_ID}" \
                 --form-string "parse_mode=HTML" \
                 --form-string "caption=🔌 <b>Universal Magisk/KSU Module</b>
          (Flash this if you only want the Wi-Fi Monitor Mode features on ANY custom kernel without changing your boot.img. Auto-adapts to your kernel version!)" \
                 "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendDocument"
          fi
          
