name: EvilTwin — Build KernelSU-Next + SuSFS

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub Release with the flashable zip"
        type: boolean
        default: false
  push:
    branches: [ "17" ]
    paths-ignore: [ '**/*.md', 'docs/**', 'assets/**' ]

concurrency:
  group: eviltwin-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: write

env:
  EVILTWIN_VERSION: "v1.0"
  ZIP_PREFIX: "EvilTwin"
  KBUILD_BUILD_USER: "Raju-yeager"
  KBUILD_BUILD_HOST: "EvilTwin"
  NEUTRON_BUILD: "30062026"
  NEUTRON_SHA256: b473a420d693a4e3bc71b56ec4283c0e3738f87d6ac37fa202bb0be5e0a07521
  ANTMAN_COMMIT: 0b32c45e3ad83a953b4bc3fd2feb4ad3cc87c1e8
  ANTMAN_SHA256: deef2dcf11568403c712432ecb7678ef62c3244054ccfee8510ef94a8a8fb04d

jobs:
  build:
    name: EvilTwin (ksun-susfs)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout EvilTwin Kernel
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bc bison flex build-essential \
            libssl-dev libncurses-dev libelf-dev zlib1g-dev pkg-config git curl zip cpio \
            kmod python3 ccache lld llvm dwarves zstd

      - name: Restore ccache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.ccache
          key: ccache-ksun-susfs-${{ github.sha }}
          restore-keys: |
            ccache-ksun-susfs-

      - name: Setup Neutron Clang ${{ env.NEUTRON_BUILD }}
        run: |
          set
