name: EvilTwin — Build Kernel + Patched Wi-Fi Driver

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub Release with the unified flashable zip"
        type: boolean
        default: false
  push:
    branches: [ "17" ]
    paths-ignore: [ '**/*.md', 'docs/**', 'assets/**' ]

concurrency:
  group: eviltwin-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: write

env:
  EVILTWIN_VERSION: "v1.0"
  ZIP_PREFIX: "EvilTwin"
  KBUILD_BUILD_USER: "Raju-yeager"
  KBUILD_BUILD_HOST: "EvilTwin"
  NEUTRON_BUILD: "30062026"
  NEUTRON_SHA256: b473a420d693a4e3bc71b56ec4283c0e3738f87d6ac37fa202bb0be5e0a07521
  ANTMAN_COMMIT: 0b32c45e3ad83a953b4bc3fd2feb4ad3cc87c1e8
  ANTMAN_SHA256: deef2dcf11568403c712432ecb7678ef62c3244054ccfee8510ef94a8a8fb04d

jobs:
  build:
    name: EvilTwin (ksun-susfs + qca6750)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout EvilTwin Kernel
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Checkout EvilTwin Patched Wi-Fi Modules
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Raju-yeager/Eviltwin-drivers_kernel_xiaomi_sm8635-modules
          ref: lineage-23.2
          path: modules_src
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bc bison flex build-essential \
            libssl-dev libncurses-dev libelf-dev zlib1g-dev pkg-config git curl zip cpio \
            kmod python3 python-is-python3 ccache lld llvm dwarves zstd

      - name: Restore ccache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.ccache
          key: ccache-ksun-susfs-${{ github.sha }}
          restore-keys: |
            ccache-ksun-susfs-

      - name: Setup Neutron Clang ${{ env.NEUTRON_BUILD }}
        run: |
          set -euo pipefail
          rm -rf "$HOME/clang"; mkdir -p "$HOME/clang"; cd "$HOME/clang"
          curl -fsSLO "https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/${NEUTRON_BUILD}/neutron-clang-${NEUTRON_BUILD}.tar.zst"
          echo "${NEUTRON_SHA256}  neutron-clang-${NEUTRON_BUILD}.tar.zst" | sha256sum -c
          tar -I zstd -xf "neutron-clang-${NEUTRON_BUILD}.tar.zst" && rm -f "neutron-clang-${NEUTRON_BUILD}.tar.zst"
          curl -fsSLo antman "https://raw.githubusercontent.com/Neutron-Toolchains/antman/${ANTMAN_COMMIT}/antman"
          echo "${ANTMAN_SHA256}  antman" | sha256sum -c
          chmod +x antman
          for i in 1 2 3 4; do
            ./antman --patch=glibc && break
            [ "$i" = 4 ] && { echo "::error::antman --patch=glibc failed 4 times"; exit 1; }
            echo "antman attempt $i failed; retrying in $((i*20))s"; sleep $((i*20))
          done
          ./bin/clang --version | head -1

      - name: Build EvilTwin Unified Kernel ZIP (ksun-susfs)
        env:
          ZIP_PREFIX: ${{ env.ZIP_PREFIX }}
          ZIP_VERSION: ${{ env.EVILTWIN_VERSION }}
          KMI_STRICT: "0"
          ALLOW_DIRTY: "1"
          SKIP_ZIP: "0"
        run: |
          set -euo pipefail
          export CLANG_DIR="$HOME/clang"
          chmod +x scripts/ci/build-flavor.sh
          scripts/ci/build-flavor.sh ksun-susfs

      - name: Upload EvilTwin Flashable Kernel ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: EvilTwin-ksun-susfs-zip
          path: dist/*.zip
          if-no-files-found: error

      - name: Upload Build Logs & Symvers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: EvilTwin-build-debug
          path: |
            dist/Image-*
            dist/Module.symvers-*
            dist/config-*
            out/build.log
            out/wlan_build.log
            out/kmi-diff.txt
          if-no-files-found: ignore

  release:
    needs: build
    if: success() && github.event_name == 'workflow_dispatch' && inputs.release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: EvilTwin-ksun-susfs-zip
          path: release_files
          merge-multiple: true
      - run: ls -lh release_files/
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: eviltwin-${{ env.EVILTWIN_VERSION }}-${{ github.run_number }}
          prerelease: true
          make_latest: true
          name: EvilTwin ${{ env.EVILTWIN_VERSION }} (Build #${{ github.run_number }})
          body: |
            **EvilTwin Kernel (${{ env.EVILTWIN_VERSION }}) — KernelSU-Next + SuSFS + Monitor TX Injection**
            * **Device:** POCO F6 / Redmi Turbo 3 (`peridot` · SM8635)
            * **Kernel Branch:** `${{ github.ref_name }}` @ `${{ github.sha }}`
            * **Toolchain:** Neutron Clang ${{ env.NEUTRON_BUILD }}
          files: release_files/*.zip
          
